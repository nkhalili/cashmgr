name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags: ['v*.*.*-*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cashmgr-web

jobs:
  # ── 1. Determine version and bump manifests ───────────────────────────────
  #   Stable : triggered by merged PR from release/vx.y.z into main
  #   Preview: triggered by pre-release tag push (v*.*.*-*) on release/vx.y.z
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.set.outputs.version }}
      prerelease: ${{ steps.set.outputs.prerelease }}
      target: ${{ steps.set.outputs.target }}
    if: >-
      github.actor != 'cashmgr-bot[bot]' &&
      (github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')))
    steps:
      - name: Generate App Token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Determine version, prerelease flag, checkout ref, and push target before checkout.
      # Stable : version from branch name (release/vx.y.z → x.y.z), checkout/push to main.
      # Preview: version from tag (vx.y.z-label → x.y.z-label), checkout/push to release/vx.y.z.
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF="${{ github.event.pull_request.head.ref }}"
            VERSION="${REF#release/v}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "target=main" >> $GITHUB_OUTPUT
            echo "checkout_ref=${{ github.base_ref }}" >> $GITHUB_OUTPUT
          else
            FULL_VERSION="${GITHUB_REF_NAME#v}"
            BASE_VERSION="${FULL_VERSION%%-*}"
            echo "version=${FULL_VERSION}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "target=release/v${BASE_VERSION}" >> $GITHUB_OUTPUT
            echo "checkout_ref=release/v${BASE_VERSION}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}
          ref: ${{ steps.set.outputs.checkout_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump all version fields
        run: node scripts/set-version.mjs ${{ steps.set.outputs.version }}

      - name: Commit and push
        run: |
          git config user.email "3639896+cashmgr-bot[bot]@users.noreply.github.com"
          git config user.name "cashmgr-bot[bot]"
          git add .
          git commit -m "chore: release v${{ steps.set.outputs.version }} [skip ci]"
          git push origin HEAD:${{ steps.set.outputs.target }}

  # ── 2. Build and push Docker image for the web app ────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: version-bump
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.target }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version-bump.outputs.version }}
            ${{ needs.version-bump.outputs.prerelease == 'false' && format('{0}/{1}:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}

  # ── 3a. Build desktop installers (Linux AppImage + Windows NSIS) ──────────
  desktop-linux-windows:
    runs-on: ubuntu-latest
    needs: version-bump
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.target }}

      - name: Build Linux + Windows installers via Docker
        run: |
          docker build -f apps/desktop/Dockerfile \
            --progress=plain \
            --build-arg PLATFORMS="--linux --win" \
            -t cashmgr-desktop-builder \
            .

      - name: Extract artifacts from container
        run: |
          docker create --name extract cashmgr-desktop-builder
          docker cp extract:/app/apps/desktop/release ./desktop-release
          docker rm extract

      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-bump.outputs.version }}
          files: |
            desktop-release/*.AppImage
            desktop-release/*.exe
            desktop-release/*.exe.blockmap
            desktop-release/latest*.yml

  # ── 3b. Build desktop installer (macOS DMG) ───────────────────────────────
  desktop-macos:
    runs-on: macos-latest
    needs: version-bump
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.target }}

      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages and desktop
        run: |
          pnpm --filter @cashmgr/core build
          pnpm --filter @cashmgr/db build
          pnpm --filter @cashmgr/ui build
          pnpm --filter @cashmgr/web build
          pnpm --filter @cashmgr/desktop build:electron

      - name: Package macOS DMG
        run: pnpm --filter @cashmgr/desktop exec electron-builder --mac --publish=never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-bump.outputs.version }}
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.dmg.blockmap
            apps/desktop/release/latest*.yml

  # ── 4a. Build mobile apps via EAS (iOS + Android) — stable only ──────────
  #        Requires: EXPO_TOKEN secret (create at expo.dev/settings/access-tokens)
  #        iOS also requires Apple Developer account ($99/yr) for store distribution
  mobile:
    runs-on: ubuntu-latest
    needs: version-bump
    if: needs.version-bump.outputs.prerelease == 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.target }}

      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS + Android via EAS
        run: pnpm --filter @cashmgr/mobile exec eas build --platform all --profile production --non-interactive --auto-submit

  # ── 4b. Build preview mobile apps via EAS — preview only ─────────────────
  mobile-preview:
    runs-on: ubuntu-latest
    needs: version-bump
    if: needs.version-bump.outputs.prerelease == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.target }}

      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview via EAS
        run: pnpm --filter @cashmgr/mobile exec eas build --platform all --profile preview --non-interactive

  # ── 5. Create GitHub Release with changelog ───────────────────────────────
  github-release:
    runs-on: ubuntu-latest
    needs: [version-bump, docker, desktop-linux-windows, desktop-macos]
    if: always() && needs.version-bump.result == 'success' && !failure() && !cancelled()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # For stable releases, find the previous stable tag so "What's Changed"
      # covers the full release (since last stable) not just since the last rc/beta.
      - name: Find previous stable tag
        id: prev_stable
        if: needs.version-bump.outputs.prerelease == 'false'
        run: |
          git fetch --tags
          PREV=$(git tag --sort=-version:refname | grep -v '-' | grep -v "^v${{ needs.version-bump.outputs.version }}$" | head -1)
          echo "tag=${PREV}" >> $GITHUB_OUTPUT

      - name: Generate changelog from last stable
        id: changelog
        if: needs.version-bump.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(gh api --method POST /repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="v${{ needs.version-bump.outputs.version }}" \
            -f previous_tag_name="${{ steps.prev_stable.outputs.tag }}" \
            --jq '.body')
          {
            echo "body<<DELIM"
            echo "$BODY"
            echo "DELIM"
          } >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-bump.outputs.version }}
          name: v${{ needs.version-bump.outputs.version }}
          prerelease: ${{ needs.version-bump.outputs.prerelease == 'true' }}
          generate_release_notes: ${{ needs.version-bump.outputs.prerelease == 'true' }}
          body: |
            ## Downloads

            | Platform | Installer | Notes |
            |----------|-----------|-------|
            | 🪟 Windows | `Cash Mgr Setup *.exe` | NSIS installer (recommended) |
            | 🐧 Linux | `Cash Mgr-*.AppImage` | AppImage (run directly) |
            | 🍎 macOS | `Cash Mgr-*.dmg` | Drag to Applications |

            ---
            ${{ steps.changelog.outputs.body }}
          append_body: ${{ needs.version-bump.outputs.prerelease == 'true' }}
