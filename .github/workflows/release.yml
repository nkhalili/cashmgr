name: Release

on:
  push:
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cashmgr-web

jobs:
  # ── 1. Bump versions in all manifests and commit back to main ──────────────
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.set.outputs.version }}
    if: github.actor != 'cashmgr-bot[bot]'
    steps:
      - name: Generate App Token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}
          ref: main

      - id: set
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump all version fields
        run: node scripts/set-version.mjs ${{ steps.set.outputs.version }}

      - name: Commit and push
        run: |
          git config user.email "3639896+cashmgr-bot[bot]@users.noreply.github.com"
          git config user.name "cashmgr-bot[bot]"
          git add .
          git commit -m "chore: release v${{ steps.set.outputs.version }} [skip ci]"
          git push origin HEAD:main

  # ── 2. Build and push Docker image for the web app ────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: version-bump
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version-bump.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ── 3a. Build desktop installers (Linux AppImage + Windows NSIS) ──────────
  desktop-linux-windows:
    runs-on: ubuntu-latest
    needs: version-bump
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build Linux + Windows installers via Docker
        run: |
          docker build -f apps/desktop/Dockerfile \
            --progress=plain \
            --build-arg PLATFORMS="--linux --win" \
            -t cashmgr-desktop-builder \
            .

      - name: Extract artifacts from container
        run: |
          docker create --name extract cashmgr-desktop-builder
          docker cp extract:/app/apps/desktop/release ./desktop-release
          docker rm extract

      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-release/*.AppImage
            desktop-release/*.exe
            desktop-release/*.exe.blockmap
            desktop-release/latest*.yml

  # ── 3b. Build desktop installer (macOS DMG) ───────────────────────────────
  desktop-macos:
    runs-on: macos-latest
    needs: version-bump
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages and desktop
        run: |
          pnpm --filter @cashmgr/core build
          pnpm --filter @cashmgr/db build
          pnpm --filter @cashmgr/ui build
          pnpm --filter @cashmgr/web build
          pnpm --filter @cashmgr/desktop build:electron

      - name: Package macOS DMG
        run: pnpm --filter @cashmgr/desktop exec electron-builder --mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.dmg.blockmap
            apps/desktop/release/latest*.yml

  # ── 4. Build mobile apps via EAS (iOS + Android) ─────────────────────────
  #       Requires: EXPO_TOKEN secret (create at expo.dev/settings/access-tokens)
  #       iOS also requires Apple Developer account ($99/yr) for store distribution
  mobile:
    runs-on: ubuntu-latest
    needs: version-bump
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS + Android via EAS
        run: pnpm --filter @cashmgr/mobile exec eas build --platform all --profile production --non-interactive --auto-submit

  # ── 5. Create GitHub Release with changelog ───────────────────────────────
  github-release:
    runs-on: ubuntu-latest
    needs: [version-bump, docker, desktop-linux-windows, desktop-macos, mobile]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.version-bump.outputs.version }}
          body: |
            ## Downloads

            | Platform | Installer | Notes |
            |----------|-----------|-------|
            | 🪟 Windows | `Cash Mgr Setup *.exe` | NSIS installer (recommended) |
            | 🪟 Windows | `Cash Mgr *.exe` | Portable (no install needed) |
            | 🐧 Linux | `Cash Mgr-*.AppImage` | AppImage (run directly) |
            | 🍎 macOS | `Cash Mgr-*.dmg` | Drag to Applications |

            > Auto-update is built in — once installed, Cash Mgr updates itself.

            ---
          append_body: true
          generate_release_notes: true
